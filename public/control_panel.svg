<svg width="400" height="400" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Frame -->
    <rect x="10" y="17.5" width="100" height="85" rx="2" fill="#a8a8a8" stroke="#3E2B25" stroke-width="2.5"></rect>
    
    <!-- Screws (Corners) -->
    <circle cx="14" cy="21.5" r="1.2" fill="#3E2B25" opacity="0.3"></circle>
    <circle cx="106" cy="21.5" r="1.2" fill="#3E2B25" opacity="0.3"></circle>
    <circle cx="14" cy="98.5" r="1.2" fill="#3E2B25" opacity="0.3"></circle>
    <circle cx="106" cy="98.5" r="1.2" fill="#3E2B25" opacity="0.3"></circle>

    <!-- LEFT ZONE: Gauge & Labels -->
    <g transform="translate(18, 29.5)">
        <!-- Voltmeter -->
        <path d="M0 22 A 20 20 0 0 1 40 22 L 40 28 L 0 28 Z" fill="#fdf5e6" stroke="#3E2B25" stroke-width="1.5"></path>
        <g transform="rotate(15, 20, 22)">
            <line x1="20" y1="22" x2="20" y2="5" stroke="#c0392b" stroke-width="2" stroke-linecap="round">
                <animateTransform attributeName="transform" type="rotate" from="-1 20 22" to="1 20 22" dur="0.1s" repeatCount="indefinite" additive="sum"></animateTransform>
            </line>
        </g>
        <circle cx="20" cy="22" r="3" fill="#3E2B25"></circle>

        <!-- Faux Labels underneath -->
        <g transform="translate(4, 38)" opacity="0.6">
            <rect width="20" height="2.5" fill="white" rx="0.5"></rect>
            <rect y="6" width="14" height="2.5" fill="white" rx="0.5"></rect>
            <rect y="12" width="18" height="2.5" fill="white" rx="0.5"></rect>
        </g>
    </g>

    <!-- RIGHT ZONE: Vertical Sliders -->
    <g transform="translate(62, 29.5)">
        <!-- Track 1 -->
        <rect x="6" y="0" width="1.5" height="42" rx="0.75" fill="#3E2B25" opacity="0.3"></rect>
        <rect x="1" y="19" width="12" height="8" rx="1" fill="#fdf5e6" stroke="#3E2B25" stroke-width="1.2"></rect>
        
        <!-- Track 2 -->
        <rect x="20" y="0" width="1.5" height="42" rx="0.75" fill="#3E2B25" opacity="0.3"></rect>
        <rect x="15" y="4" width="12" height="8" rx="1" fill="#fdf5e6" stroke="#3E2B25" stroke-width="1.2"></rect>
        
        <!-- Track 3 -->
        <rect x="34" y="0" width="1.5" height="42" rx="0.75" fill="#3E2B25" opacity="0.3"></rect>
        <rect x="29" y="29" width="12" height="8" rx="1" fill="#fdf5e6" stroke="#3E2B25" stroke-width="1.2"></rect>
    </g>

    <!-- BOTTOM ZONE: Indicators -->
    <g transform="translate(20, 88.5)">
        
            <circle cx="0" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="11.428571428571429" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="0.7s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="22.857142857142858" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="34.285714285714285" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="0.9s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="45.714285714285715" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="57.142857142857146" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="1.1s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="68.57142857142857" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="1.2000000000000002s" repeatCount="indefinite"></animate>
            </circle>
        
            <circle cx="80" cy="0" r="2.2" fill="#F4D35E" stroke="#3E2B25" stroke-width="0.8">
                 <animate attributeName="fill-opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite"></animate>
            </circle>
        
    </g>
</svg>
<svg width="400" height="400" viewBox="14 25 92 85" xmlns="http://www.w3.org/2000/svg" style="background:transparent">
            <style>
                /* Drawer pops open snappily */
                .drawer-anim { animation: drawerMove 3s steps(15) forwards; }
                
                /* Papers fly UP and then drift OVER the front */
                .paper-anim { animation: paperFlyOver 3.5s cubic-bezier(0.1, 0.5, 0.3, 1) forwards; }
                
                @keyframes drawerMove {
                    0%, 100% { transform: translateY(0); }
                    10%, 85% { transform: translateY(13.200000000000001px); }
                }
                @keyframes paperFlyOver {
                    0% { transform: translate(52px, 45px) scale(0); opacity: 0; }
                    10% { opacity: 1; transform: translate(52px, 5px) scale(1.1) rotate(5deg); }
                    30% { opacity: 1; transform: translate(var(--tx), 15px) scaleX(-0.6) rotate(var(--rt)); }
                    90% { opacity: 1 }
                    100% { transform: translate(var(--tx), 105px) scaleX(1) rotate(var(--rt)); opacity: 0; }
                }
            </style>

            <!-- LAYER 1: INTERIOR (Hidden behind drawers) -->
            <rect x="19.5" y="30" width="81" height="79" fill="#c0392b"></rect>

            <!-- LAYER 2: CABINET FRAME (Compound path with a window) -->
            <path d="M18.5 29 h83 v81 h-83 z M20.5 31 v77 h79 v-77 z" fill="#7f4d48" stroke="#3E2B25" stroke-width="1" fill-rule="evenodd"></path>

            <!-- LAYER 3: TOP DRAWER (Moves) -->
            <g id="drw" class="drawer-anim">
                <rect x="24.5" y="35" width="71" height="33" fill="#c0392b" stroke="#3E2B25" stroke-width="1.2" rx="0.5"></rect>
                <circle cx="60" cy="51.5" r="2.8" fill="#f4d35e" stroke="#3E2B25" stroke-width="0.8"></circle>
            </g>

            <!-- LAYER 4: BOTTOM DRAWER (Static) -->
            <g>
                <rect x="24.5" y="70" width="71" height="33" fill="#c0392b" stroke="#3E2B25" stroke-width="1.2" rx="0.5"></rect>
                <circle cx="60" cy="86.5" r="2.8" fill="#f4d35e" stroke="#3E2B25" stroke-width="0.8"></circle>
            </g>

            <!-- LAYER 5: LEGS -->
            <rect x="19.5" y="109" width="10" height="5" fill="#3E2B25" rx="1"></rect>
            <rect x="90.5" y="109" width="10" height="5" fill="#3E2B25" rx="1"></rect>

            <!-- LAYER 6: THE PAPERS (Top Layer - ensures they float OVER the entire unit) -->
            <g id="papers">
                <rect class="paper paper-anim" width="16" height="22" fill="white" stroke="#3E2B25" stroke-width="0.6" style="--tx: 15px; --rt: -15deg; opacity: 0; animation-delay: 0.3s;"></rect>
                <rect class="paper paper-anim" width="16" height="22" fill="white" stroke="#3E2B25" stroke-width="0.6" style="--tx: 90px; --rt: 20deg; opacity: 0; animation-delay: 0.5s;"></rect>
                <rect class="paper paper-anim" width="16" height="22" fill="white" stroke="#3E2B25" stroke-width="0.6" style="--tx: 55px; --rt: 5deg; opacity: 0; animation-delay: 0.7s;"></rect>
            </g>
        </svg>